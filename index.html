<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfólio de videomaker — casamentos, eventos, shows, baladas e teasers cinematográficos." />
  <title>Nicolas Godoy — Videomaker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="noise" aria-hidden="true"></div>

  <header class="profile" role="banner">
    <div class="profile__inner">

      <figure class="profile__avatar-wrap">
        <div class="profile__avatar" aria-label="Foto de perfil de Nicolas Godoy">
          <div class="profile__avatar-placeholder">NG</div>
        </div>
      </figure>

      <div class="profile__info">
        <h1 class="profile__name">Nicolas Godoy</h1>
        <p class="profile__handle">@nicolasfgodoy</p>

        <ul class="profile__stats" aria-label="Estatísticas do perfil">
          <li class="profile__stat">
            <strong class="profile__stat-value" id="stat-projects">9</strong>
            <span class="profile__stat-label">projetos</span>
          </li>
          <li class="profile__stat">
            <strong class="profile__stat-value">8</strong>
            <span class="profile__stat-label">anos</span>
          </li>
          <li class="profile__stat">
            <strong class="profile__stat-value">12M</strong>
            <span class="profile__stat-label">views</span>
          </li>
        </ul>

        <div class="profile__bio">
          <span>Videomaker cinematográfico</span>
          <span>Casamentos, eventos, shows, baladas</span>
          <span>São Paulo, BR</span>
          <span>Blackmagic 4K</span>
          <span>Sim, eu edito no Premiere, me julgue.</span>
        </div>

        <a class="profile__cta" href="https://wa.me/5511932268093?text=Ol%C3%A1%20Nicolas%2C%20gostaria%20de%20solicitar%20um%20or%C3%A7amento%20para%20cobertura%20em%20v%C3%ADdeo!" target="_blank" rel="noopener noreferrer">Solicitar orçamento</a>
      </div>

    </div>

    <nav class="filters" aria-label="Filtrar por categoria">
      <button class="filter-btn filter-btn--active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="Casamentos">Casamentos</button>
      <button class="filter-btn" data-filter="Shows">Shows</button>
      <button class="filter-btn" data-filter="Baladas">Baladas</button>
      <button class="filter-btn" data-filter="Corporativo">Corporativo</button>
      <button class="filter-btn" data-filter="Teasers">Teasers</button>
    </nav>
  </header>

  <main id="main-content" class="grid-section">
    <div class="grid" id="video-grid" role="list" aria-label="Grade de vídeos">
      <p class="grid__loading" aria-live="polite">Carregando vídeos…</p>
    </div>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal__backdrop" id="modal-backdrop"></div>

    <div class="modal__reel">

      <div class="modal__video-wrap" id="modal-video-wrap">
        <iframe
          id="modal-iframe"
          class="modal__iframe"
          src=""
          title="Reprodução do vídeo"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
          allowfullscreen
          style="display:none"
        ></iframe>
        <video
          id="modal-video"
          class="modal__native-video"
          autoplay
          playsinline
          controls
          loop
          style="display:none"
        ></video>
        <div id="modal-instagram" class="modal__instagram" style="display:none"></div>

        <div class="modal__click-shield" id="modal-click-shield" aria-hidden="true"></div>
        <div class="film-burn" id="film-burn" aria-hidden="true"></div>
        <div class="film-burn film-burn--swipe" id="film-burn-swipe" aria-hidden="true"></div>
      </div>

      <div class="modal__overlay-info" aria-live="polite">
        <span class="modal__category" id="modal-category"></span>
        <h2 class="modal__title" id="modal-title"></h2>
      </div>

    </div>

    <button class="modal__close" id="modal-close" aria-label="Fechar vídeo">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <line x1="3" y1="3" x2="17" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="17" y1="3" x2="3" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>

  </div>

  <script async src="https://www.instagram.com/embed.js"></script>
  <script src="app.js"></script>
</body>
</html>
