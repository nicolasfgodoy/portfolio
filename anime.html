<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicolas F. Godoy — Portfólio</title>

  <!-- Google Fonts: League Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; /* Trava o scroll durante a splash */
    }

    /* =========================================================
       1. SPLASH SCREEN / INTRO FULLSCREEN
       ========================================================= */
    #splash-intro {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #161616;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      overflow: hidden;
      pointer-events: all;
    }

    /* Tipografia da Logo Centralizada */
    .brand-logo {
      font-family: "League Gothic", Impact, sans-serif;
      font-style: italic;
      font-stretch: condensed;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 0.9;
      color: #ffffff;
      white-space: nowrap;
      user-select: none;
      
      /* Tamanho fluido perfeito para mobile e desktop */
      font-size: clamp(3.2rem, 11vw, 9rem);
      
      /* Efeito de saída suave junto com a transição */
      animation: logoOut 0.4s cubic-bezier(0.7, 0, 0.3, 1) forwards 1.7s;
    }

    /* Camadas de Transição (Tela Inteira) */
    .wipe-layer {
      position: absolute;
      top: -20vh;
      left: -20vw;
      width: 140vw;
      height: 140vh;
      transform: translateX(-110%) skewX(-14deg);
      pointer-events: none;
    }

    /* 1º Sólido: Vermelho */
    .layer-red {
      background-color: #e50914;
      animation: sweepScreen 1.1s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.8s;
    }

    /* 2º Sólido: Branco */
    .layer-white {
      background-color: #ffffff;
      animation: sweepScreen 1.05s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.95s;
    }

    /* 3º Sólido: Fundo Escuro (Fecha a cortina e revela o site) */
    .layer-dark {
      background-color: #0f0f0f;
      animation: sweepScreen 1.0s cubic-bezier(0.77, 0, 0.175, 1) forwards 1.1s;
    }

    /* Animação do varrimento da tela */
    @keyframes sweepScreen {
      0% {
        transform: translateX(-110%) skewX(-14deg);
      }
      100% {
        transform: translateX(110%) skewX(-14deg);
      }
    }

    @keyframes logoOut {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.97);
      }
    }

    /* Fade-out final do container da splash */
    .splash-finish {
      opacity: 0;
      transition: opacity 0.5s ease-out;
      pointer-events: none !important;
    }

    /* =========================================================
       2. CONTEÚDO PRINCIPAL DO PORTFÓLIO
       ========================================================= */
    #main-portfolio {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      min-height: 100vh;
      padding: 60px 24px;
      max-width: 1280px;
      margin: 0 auto;
    }

    body.ready #main-portfolio {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Tela de Abertura / Transição -->
  <div id="splash-intro">
    <h1 class="brand-logo">@nicolasfgodoy</h1>
    <div class="wipe-layer layer-red"></div>
    <div class="wipe-layer layer-white"></div>
    <div class="wipe-layer layer-dark"></div>
  </div>

  <!-- Portfólio (Pronto por baixo) -->
  <main id="main-portfolio">
    <header style="margin-bottom: 40px; text-align: center;">
      <h2 style="font-size: 2rem; font-weight: 700;">Vídeo Maker & Motion Designer</h2>
      <p style="color: #a0a0a0; margin-top: 8px;">Trabalhos selecionados e projetos recentes</p>
    </header>

    <!-- Exemplo do Grid de Vídeos sob Demanda -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
      <div style="aspect-ratio: 9/16; background: #1c1c1c; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #555;">
        Preview Card 01
      </div>
      <div style="aspect-ratio: 9/16; background: #1c1c1c; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #555;">
        Preview Card 02
      </div>
      <div style="aspect-ratio: 9/16; background: #1c1c1c; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #555;">
        Preview Card 03
      </div>
    </div>
  </main>

  <script>
    // Gerenciador do ciclo de vida da intro
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-intro');

      // Tempo exato da transição das barras (~2.4s)
      setTimeout(() => {
        splash.classList.add('splash-finish');
        document.body.style.overflow = 'auto'; // Libera a rolagem do site
        document.body.classList.add('ready');

        // Remove a splash do DOM após a conclusão
        setTimeout(() => {
          splash.remove();
        }, 500);
      }, 2300);
    });
  </script>

</body>
</html>
